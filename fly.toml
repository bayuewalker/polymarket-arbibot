app = "polymarket-arbibot"
primary_region = "sin"

[build]

[env]
  PYTHONUNBUFFERED = "1"

[mounts]
  source = "arbibot_logs"
  destination = "/app/logs"

# Bot is a pure background worker — no HTTP needed.
# Fly requires at minimum one process definition.
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 1
    soft_limit = 1
